name: Release

# Publishes a GitHub release for a version, with the matching section of
# CHANGELOG.md as notes and a zip of the site ready to host. Runs when a version
# tag is pushed, or by hand, in which case the tag is created on `target`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag (e.g. v0.2.0)
        required: true
      target:
        description: Branch or full commit SHA to tag
        required: true
        default: main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          awk -v version="${TAG#v}" '
            /^## \[/ { if (found) exit; found = index($0, "[" version "]") > 0; next }
            /^\[[^]]+\]: / { if (found) exit }
            found
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md entry for $TAG" >&2; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ inputs.target || github.sha }}
        run: |
          commit=$(git rev-parse --verify "$TARGET^{commit}")
          git archive --format=zip --prefix="sinklink-$TAG/" -o "sinklink-$TAG.zip" "$commit" \
            index.html styles src assets LICENSE README.md
          gh release create "$TAG" "sinklink-$TAG.zip" \
            --target "$commit" --title "SinkLink $TAG" --notes-file notes.md
